version: "2"

sql: 
      - schema: "internal/repository/migrate/init/"
        queries: "internal/repository/querys/"
        engine: "postgresql"
        gen:
            go: 
                package: "sqlc"
                out: "internal/repository/sqlc"
                sql_package: "pgx/v5"
                emit_json_tags: true
                emit_interface: true
                emit_empty_slices: true
                overrides: 


                    - db_type: "pg_catalog.numeric"
                      go_type:
                        import:  "github.com/shopspring/decimal"
                        type: "Decimal"
                    - db_type: "pg_catalog.numeric"
                      nullable: true
                      go_type: 
                        import:  "github.com/shopspring/decimal"
                        type: "NullDecimal"
                        pointer: true

                    - db_type: "numeric"
                      go_type:
                        import:  "github.com/shopspring/decimal"
                        type: "Decimal"


                    - db_type: "pg_catalog.int8"
                      nullable: true
                      go_type: 
                        type:  "int64"
                        pointer: true

                    - db_type: "int8"
                      nullable: true
                      go_type: 
                        type: "int64"
                        pointer: true




                    - db_type: "pg_catalog.timestamptz"
                      go_type: 
                        import:  "time"
                        type: "Time"
                    - db_type: "pg_catalog.timestamptz"
                      nullable: true
                      go_type: 
                        import:  "time"
                        type: "Time"
                        pointer: true
                    - db_type: "timestamptz"
                      go_type:
                        import:  "time"
                        type: "Time"
                    - db_type: "timestamptz"
                      nullable: true
                      go_type: 
                        import:  "time"
                        type: "Time"
                        pointer: true

                    



                    - db_type: "pg_catalog.date"
                      nullable: true
                      go_type: 
                        import:  "time"
                        type: "Time"
                        pointer: true
                    - db_type: "pg_catalog.date"
                      go_type: 
                        import:  "time"
                        type: "Time"

                    - db_type: "date"
                      go_type:
                        import:  "time"
                        type: "Time"
                    - db_type: "date"
                      nullable: true
                      go_type: 
                        import:  "time"
                        type: "Time"
                        pointer: true
                    
                    - db_type: "pg_catalog.text"
                      go_type: "string"

                    # - db_type: "text"
                    #   nullable: true
                    #   go_type: "string"

                    - db_type: "pg_catalog.text"
                      nullable: true
                      go_type: 
                        type: "string"
                        pointer: true

                    - db_type: "text"
                      nullable: true
                      go_type: 
                        type: "string"
                        pointer: true




                    - db_type: "pg_catalog.bool"
                      go_type: "bool"

                    - db_type: "pg_catalog.bool"
                      nullable: true
                      go_type: 
                        type: "bool"
                        pointer: true

                    - db_type: "bool"
                      nullable: true
                      go_type: 
                        type: "bool"
                        pointer: true