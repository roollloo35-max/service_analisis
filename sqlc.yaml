version: "2"

sql: 
      - schema: "internal/repository/migrate/init/"
        queries: "internal/repository/querys/"
        engine: "postgresql"
        gen:
            go: 
                package: "sqlc"
                out: "internal/repository/sqlc"
                emit_json_tags: true
                emit_interface: true
                emit_empty_slices: true
                overrides: 
                    - db_type: "pg_catalog.numeric"
                      go_type: "github.com/shopspring/decimal.Decimal"
                    - db_type: "pg_catalog.numeric"
                      nullable: true
                      go_type: "github.com/shopspring/decimal.Decimal"
